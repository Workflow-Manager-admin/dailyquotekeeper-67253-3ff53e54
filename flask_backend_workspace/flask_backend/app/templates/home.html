<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Quote Saver</title>
</head>
<body>
    <h1>Submit Your Daily Quote</h1>
    <form action="{{ url_for('quotes.add_quote') }}" method="post">
        <label for="quote">Quote:</label>
        <input type="text" id="quote" name="quote" required>
        <button type="submit">Add Quote</button>
    </form>
    <br>
    <a href="{{ url_for('quotes.view_quotes') }}">View all saved quotes</a>
</body>
</html>
